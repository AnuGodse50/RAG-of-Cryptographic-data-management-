<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Case Dossier - Secure DMS</title>
    <link rel="stylesheet" href="shared/base.css">
    <script src="shared/auth-guard.js"></script>
</head>
<body>
    <div class="container">
        <h2>FIR #2026-089: Dossier</h2>
        <p style="margin-bottom: 2rem;">Offence: Snatching (BNS §304)</p>
        
        <div class="grid grid-2">
            <div>
                <div class="card">
                    <h3>Cryptographic Evidence Vault</h3>
                    <ul style="margin-top: 1rem; list-style: none;">
                        <li style="padding: 0.75rem 0; border-bottom: 1px solid var(--color-gray);">
                            ?? FIR Document <span style="float: right; color: var(--color-success); font-weight: bold;">Verified ?</span>
                        </li>
                        <li style="padding: 0.75rem 0; border-bottom: 1px solid var(--color-gray);">
                            ?? Witness Statement 1 <span style="float: right; color: var(--color-success); font-weight: bold;">Verified ?</span>
                        </li>
                    </ul>
                </div>
            </div>
            
            <div class="card">
                <h3>Case Intelligence (RAG Assistant)</h3>
                <p style="font-size: 0.9rem; margin-bottom: 1rem; color: #666;">Ask questions over encrypted chunks and the legal corpus.</p>
                <div id="intelPanel"></div>
            </div>
        </div>
    </div>
    <script src="shared/ui.js"></script>
    <script src="shared/api.js"></script>
    <script src="shared/intelligence-panel.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new IntelligencePanel('intelPanel', '1');
        });
    </script>
</body>
</html>
